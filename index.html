dEventListener('pointerup',()=>{if(drag){drag=null;renderGantt()}});$('#eb-copy').onclick=()=>{const t=Object.keys(CH).map(id=>{const i=itemById[id];return`${id} | ${i.name} | ${i.start} → ${i.end} | ${GG(i.start,i.end)}`}).join('\n')||'Nessuna modifica';const done=()=>{$('#eb-n').textContent='Copiato'};try{navigator.clipboard.writeText(t).then(done,()=>{prompt('Copia manualmente',t)})}catch(e){prompt('Copia manualmente',t)}};}
