function openDeliv(key){const[g,ks]=key.split(':'),k=+ks;const its=ITEMS.filter(i=>i.phase===g).sort((x,y)=>d(x.start)-d(y.start)||(x.order||0)-(y.order||0));const gmax=Math.max(...its.map(i=>d(i.end))),gl=PHASES[g].label;const mk=DELIVS.filter(m=>m.group===g).map(m=>Object.assign({},m,{t:m.date?d(m.date):gmax}));const m=mk[k],lo=k?mk[k-1].t:-Infinity,last=k===mk.length-1;const inR=i=>d(i.end)>lo&&d(i.end)<=m.t;const blk=a=>a.filter(i=>i.outputs&&i.outputs.length).map(i=>`<div class="dli"><div class="tt">${esc(i.name)}</div><ul>${i.outputs.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`).join('');const bars=its.filter(i=>i.kind==='bar'&&inR(i)),ms=its.filter(i=>i.kind==='milestone'&&inR(i));const after=last?its.filter(i=>d(i.end)>m.t&&i.kind==='bar'):[];const title=m.label?`Deliverable ${m.label} · ${gl}`:`Deliverable · ${gl}`;let h=head(`<span class="tag"><i style="background:#5BBDEB"></i>Fine blocco · ${esc(gl)}</span>`,title)

function taskHtml(id){const t=taskById[id];const p=PHASES[t.phase];const it=t.item?itemById[t.item]:null;const meet=it&&it.kind==='milestone';let h=head(`<span class="tag"><i style="background:${taskCo(t).color}"></i>${esc(p.label)} · ${esc(taskCo(t).label)}</span>`,t.title)
