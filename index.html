$('#btn-today').onclick=scrollToday;const ICON='<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';function renderTasks(){const done=TASKS.filter(t=>t.status==='done').length;$('#pbar').style.width=(100*done/TASKS.length)+'%';$('#ptxt').textContent=`${done} di ${TASKS.length} fatte`;const box=$('#statuschips');box.innerHTML='';[['all','Tutte']].concat(Object.entries(STATUSES)).forEach(([k,l])=>{const n=k==='all'?TASKS.length:TASKS.filter(t=>t.status===k).length;const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',statusF===k);b.textContent=`${l} · ${n}`;b.onclick=()=>{statusF=k;renderTasks()};box.appendChild(b);});const list=TASKS.filter(t=>statusF==='all'||t.status===statusF).sort((a,b)=>d(a.due)-d(b.due));$('#tlist').innerHTML=list.length?list.map(t=>`<button class="trow st-${t.status}" data-t="${t.id}" type="button"><span class="tick">${t.status==='done'?ICON:''}</span><span><span class="tt">${esc(t.title)}</span><br><span class="tm">${esc(t.owner)}</span></span><span class="tm">entro ${fmt(d(t.due))}</span><span class="pill ${t.status}">${STATUSES[t.status]}</span></button>`).join(''):'<div class="trow"><span></span><span class="empty">Nessuna task in questo stato.</span></div>';$('#tlist').querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{if(MQ.matches)selectTask(el.dataset.t);else openTask(el.dataset.t)});if(MQ.matches&&list.length){if(!list.some(x=>x.id===selT))selT=list[0].id;selectTask(selT)}else if(!list.length)$('#tpanel').innerHTML='';mark();}
function list(a){return a&&a.length?'<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<div class="empty">Da definire.</div>'}
function links(a){return a&&a.length?'<ul>'+a.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join('')+'</ul>':'<div class="empty">Nessun link per ora.</div>'}
function show(html,id){curId=id;$('#dbody').innerHTML=html;document.body.classList.add('open');$('#drawer').setAttribute('aria-hidden','false');mark();$('#dx').focus()}
function openItem(id){const i=itemById[id];const p=PHASES[i.phase];const t=i.task?taskById[i.task]:null;const a=d(i.start),b=d(i.end);const per=i.kind==='milestone'?fmtL(a):`${fmtL(a)} → ${fmtL(b)}`;let h=`<span class="tag"><i style="background:${p.color}"></i>${esc(p.label)}</span><h2>${esc(i.name)}</h2>
  <dl class="kv"><dt>Quando</dt><dd>${per}</dd>${i.kind==='bar'?`<dt>Durata</dt><dd>${workdays(i.start,i.end)}giorni lavorativi</dd>`:''}<dt>Chi</dt><dd>${esc(i.owner)}</dd>${t?`<dt>Stato</dt><dd><span class="pill ${t.status}">${STATUSES[t.status]}</span></dd>`:''}</dl>
  <p>${esc(i.summary)}</p>`;if(i.phase==='dev')h+='<div class="warn">Date indicative: da confermare con lo sviluppatore.</div>';if(i.kind==='milestone'&&i.agenda.length)h+=`<h3>Temi da discutere</h3>${list(i.agenda)}`;if(i.outputs.length)h+=`<h3>Esito atteso</h3>${list(i.outputs)}`;if(t)h+=`<h3>Task collegata</h3><p><a href="#tasks" data-goto="${t.id}">${esc(t.title)}</a></p>`;show(h,i.id);$('#dbody').querySelectorAll('[data-goto]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoTask(el.dataset.goto)});}
function taskHtml(id){const t=taskById[id];const p=PHASES[t.phase];const it=t.item?itemById[t.item]:null;let h=`<span class="tag"><i style="background:${p.color}"></i>${esc(p.label)}</span><h2>${esc(t.title)}</h2>
  <dl class="kv"><dt>Stato</dt><dd><span class="pill ${t.status}">${STATUSES[t.status]}</span></dd><dt>Entro</dt><dd>${fmtL(d(t.due))}</dd><dt>Chi</dt><dd>${esc(t.owner)}</dd></dl>
  <h3>Obiettivo</h3><p>${esc(t.goal)}</p>
  <h3>Agenda e temi di discussione</h3>${list(t.agenda)}
  <h3>Link e documenti</h3>${links(t.links)}`;if(it)h+=`<h3>In roadmap</h3><p><a href="#roadmap" data-goto="${it.id}">${esc(it.name)}</a>, ${fmt(d(it.start))}${it.kind==='bar'?' → '+fmt(d(it.end)):''}</p>`;return h;}
function bindGoto(root){root.querySelectorAll('[data-goto]').forEach(el=>el.onclick=e=>{e.preventDefault();setTab('roadmap');openItem(el.dataset.goto)})}
function openTask(id){show(taskHtml(id),id);bindGoto($('#dbody'))}
function selectTask(id){selT=id;$('#tpanel').innerHTML=taskHtml(id);$('#tpanel').scrollTop=0;bindGoto($('#tpanel'));mark()}
function gotoTask(id){setTab('tasks');if(MQ.matches)selectTask(id);else openTask(id)}
function closeDrawer(){document.body.classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');curId=null;mark()}
function mark(){document.querySelectorAll('.bar,.ms').forEach(e=>e.setAttribute('aria-current',e.dataset.id===curId));document.querySelectorAll('.trow[data-t]').forEach(e=>e.setAttribute('aria-current',e.dataset.t===(MQ.matches?selT:curId)));}
$('#dx').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});function setTab(n){['roadmap','tasks'].forEach(k=>{$('#p-'+k).hidden=k!==n;$('#tab-'+k).setAttribute('aria-selected',k===n)});try{if(location.hash!=='#'+n)history.replaceState(null,'','#'+n)}catch(e){}
closeDrawer();if(n==='roadmap'){if(fitDW())renderGantt();scrollToday()}}
$('#tab-roadmap').onclick=()=>setTab('roadmap');$('#tab-tasks').onclick=()=>setTab('tasks');window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='tasks'||h==='roadmap')setTab(h)});renderGantt();renderTasks();MQ.addEventListener('change',()=>{closeDrawer();renderTasks()});let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{if(!$('#p-roadmap').hidden&&fitDW())renderGantt()},120)});setTab(location.hash==='#tasks'?'tasks':'roadmap');}</script>
