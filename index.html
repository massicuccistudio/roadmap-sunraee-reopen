+`<p>Cosa è pronto${m.label?' alla consegna '+esc(m.label):' al termine della fase '+esc(gl)}.</p>`+`<h3>Deliverable</h3>`+(blk(bars)||'<p class="empty">Nessun deliverable definito.</p>');if(blk(ms))h+=`<h3>Esiti degli incontri</h3>`+blk(ms);if(after.length)h+=`<h3>Dopo questa consegna</h3><ul>${after.map(i=>`<li>${esc(i.name)}(${sh(d(i.start))}→ ${sh(d(i.end))})</li>`).join('')}</ul>`;if(g==='dev')h+='<div class="warn">Date indicative: da confermare con lo sviluppatore.</div>';show(h,'dl-'+key);}
function taskHtml(id){const t=taskById[id];const p=PHASES[t.phase];const it=t.item?itemById[t.item]:null;const meet=it&&it.kind==='milestone';let h=head(`<span class="tag"><i style="background:${taskCo(t).color}"></i>${esc(p.label)} · ${esc(taskCo(t).label)}</span>`,t.title)
+tbl([['Entro',sh(d(t.due))],['Chi',esc(t.owner)],['Stato',pillOf(t)]])
+`<h3>Obiettivo</h3><p>${esc(t.goal)}</p>`+askBlock(it)+methBlock(it);if(t.agenda&&t.agenda.length)h+=`<h3>${meet?'Agenda':'Punti di lavoro'}</h3>${list(t.agenda)}`;h+=`<h3>Link e documenti</h3>${links(t.links)}`+wfBlock(it&&it.wf);if(it)h+=`<h3>In roadmap</h3><p><a href="#roadmap" data-goto="${it.id}">${esc(it.name)}</a>, ${fmt(d(it.start))}${it.kind==='bar'?' → '+fmt(d(it.end)):''}</p>`;return h;}
function bindGoto(root){root.querySelectorAll('[data-goto]').forEach(el=>el.onclick=e=>{e.preventDefault();setTab('roadmap');openItem(el.dataset.goto)})}
function openTask(id){show(taskHtml(id),id);bindGoto($('#dbody'))}
function selectTask(id){selT=id;$('#tpanel').innerHTML=taskHtml(id);$('#tpanel').scrollTop=0;bindGoto($('#tpanel'));mark()}
function gotoTask(id){setTab('tasks');if(MQ.matches)selectTask(id);else openTask(id)}
function closeDrawer(){document.body.classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');curId=null;mark()}
function mark(){document.querySelectorAll('.bar,.ms').forEach(e=>e.setAttribute('aria-current',e.dataset.id===curId));document.querySelectorAll('.trow[data-t]').forEach(e=>e.setAttribute('aria-current',e.dataset.t===(MQ.matches?selT:curId)));}
(function(){const sel=$('#gf');GROUPS.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=PHASES[g].label;sel.appendChild(o)});sel.onchange=()=>{gf=sel.value;renderGantt()}})();$('#dx').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});function setTab(n){['roadmap','tasks'].forEach(k=>{$('#p-'+k).hidden=k!==n;$('#tab-'+k).setAttribute('aria-selected',k===n)});try{if(location.hash!=='#'+n)history.replaceState(null,'','#'+n)}catch(e){}
closeDrawer();if(n==='roadmap'){if(fitDW())renderGantt()}}
$('#tab-roadmap').onclick=()=>setTab('roadmap');$('#tab-tasks').onclick=()=>setTab('tasks');window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='tasks'||h==='roadmap')setTab(h)});renderGantt();renderTasks();MQ.addEventListener('change',()=>{closeDrawer();renderTasks()});let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{if(!$('#p-roadmap').hidden&&fitDW())renderGantt()},120)});if(EDIT){const eb=document.createElement('div');eb.id='editbar';eb.innerHTML='<b>Modalità modifica</b><span>Trascina i bordi di una barra per cambiarne la durata. Poi copia l\'elenco e incollalo in chat.</span><button class="btn" id="eb-copy" type="button">Copia modifiche</button><span id="eb-n" class="tm"></span>';$('#p-roadmap').insertBefore(eb,$('#gantt'));const CH={};let drag=null;const base={};ITEMS.forEach(i=>base[i.id]=[i.start,i.end]);const upd=()=>{const n=Object.keys(CH).length;$('#eb-n').textContent=n?n+' modific'+(n==1?'a':'he'):''};$('#gantt').addEventListener('pointerdown',e=>{const hd=e.target.closest('.hd');if(!hd)return;e.preventDefault();const i=itemById[hd.dataset.id];drag={i,side:hd.dataset.side,x0:e.clientX,s0:d(i.start),e0:d(i.end),hd};hd.setPointerCapture(e.pointerId)});window.addEventListener('pointermove',e=>{if(!drag)return;const dl=Math.round((e.clientX-drag.x0)/DW)*MS;const i=drag.i;if(drag.side==='r')i.end=iso(Math.max(drag.s0,drag.e0+dl));else i.start=iso(Math.min(drag.e0,drag.s0+dl));const g=$('#gantt'),bar=g.querySelector('.bar[data-id="'+i.id+'"]'),a=d(i.start),b=d(i.end),x=t=>Math.round((t-T0)/MS)*DW;bar.style.left=x(a)+'px';bar.style.width=Math.max(DW,x(b)-x(a)+DW)+'px';g.querySelector('.hd[data-id="'+i.id+'"][data-side="l"]').style.left=(x(a)-4)+'px';g.querySelector('.hd[data-id="'+i.id+'"][data-side="r"]').style.left=(x(b)+DW-4)+'px';bar.title=i.name+': '+fmt(a)+'-'+fmt(b)+' ('+GG(i.start,i.end)+')';if(i.start===base[i.id][0]&&i.end===base[i.id][1])delete CH[i.id];else CH[i.id]=1;upd()});window.addEventListener('pointerup',()=>{if(drag){drag=null;renderGantt()}});$('#eb-copy').onclick=()=>{const t=Object.keys(CH).map(id=>{const i=itemById[id];return`${id} | ${i.name} | ${i.start} → ${i.end} | ${GG(i.start,i.end)}`}).join('\n')||'Nessuna modifica';const done=()=>{$('#eb-n').textContent='Copiato'};try{navigator.clipboard.writeText(t).then(done,()=>{prompt('Copia manualmente',t)})}catch(e){prompt('Copia manualmente',t)}};}
setTab(location.hash==='#tasks'?'tasks':'roadmap');}</script>
