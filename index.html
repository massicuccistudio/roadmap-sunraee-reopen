<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Roadmap Re Open · Sun RAEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Palette dalla presentazione: teal 006983 e 63C0BB su inchiostro 23393F. Layout: header + tab, Gantt con colonna etichette fissa, drawer di dettaglio a destra. */
:root{
  --ink:#23393F; --teal:#006983; --mint:#63C0BB; --grey:#535353; --line:#D9E2E4; --soft:#F3F7F7; --bg:#FFFFFF; --alert:#A73023; --sr:#A73023;
  --display:"Barlow","Helvetica Neue",Arial,sans-serif; --body:"Fira Sans","Helvetica Neue",Arial,sans-serif;
  --labw:272px; --dw:17px;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;color-scheme:light}
button{font:inherit;color:inherit}
.wrap{height:100vh;height:100dvh;box-sizing:border-box;max-width:none;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#app[hidden]{display:none}
section[role=tabpanel]:not([hidden]){flex:1;min-height:0;display:flex;flex-direction:column}
.legend,.note,.tools,.stats,nav,header,.foot{flex:none}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:22px;line-height:1.1}
.brand span{color:var(--teal)} .brand span.sr{color:var(--sr)} .brand i{font-style:normal;color:#9AA0A6}
.sub{color:var(--grey);margin-top:6px}
.meta{display:flex;gap:20px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta div{display:flex;flex-direction:column}
.meta b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.meta small{color:var(--grey);font-size:12px}
nav{display:flex;gap:4px}
.navbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin:14px 0 12px;flex:none}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;cursor:pointer;color:var(--grey)}
nav button[aria-selected="true"]{color:var(--teal);border-color:var(--teal)}
nav button:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--teal);box-shadow:inset 0 -2px 0 var(--teal)}
.chip[aria-pressed="false"]{color:var(--grey);opacity:.7}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.btn{border:1px solid var(--teal);color:var(--teal);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--teal);color:#fff}
.note{color:var(--grey);font-size:12.5px;margin-top:10px}
/* Gantt */
.gantt{border:1px solid var(--line);border-radius:8px;overflow-x:hidden;overflow-y:auto;flex:1;min-height:0;background:#fff}
.g-inner{position:relative;width:max-content;min-width:100%}
.hrow,.row{display:flex;align-items:stretch}
.lab{position:sticky;left:0;z-index:3;width:var(--labw);flex:0 0 var(--labw);background:#fff;border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;overflow:hidden}
.hrow{position:sticky;top:0;z-index:4;background:#fff}
.hrow .lab{z-index:5;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--grey)}
.track{position:relative;flex:0 0 auto}
.mrow,.wrow{position:relative}
.mrow{height:20px;border-bottom:1px solid var(--line)}
.mrow .cell{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:2px 5px;font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--grey);overflow:hidden;white-space:nowrap}
.wrow{height:36px;border-bottom:1px solid var(--line)}
.wrow .cell{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:3px 5px;font-size:11px;color:var(--grey);font-variant-numeric:tabular-nums}
.grp{height:28px;background:var(--soft);border-bottom:1px solid var(--line)}
.grp .lab{background:var(--soft);font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.grp .dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto;background:#9AA0A6}
.row{height:34px;border-bottom:1px solid #EDF2F3}
.row .lab{font-size:13px;cursor:pointer}
.row:hover .lab,.row:hover{background:#FAFCFC}
.row .lab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shades{position:absolute;top:0;bottom:0;left:var(--labw);right:0;pointer-events:none;z-index:1}
.shade{position:absolute;top:0;bottom:0;background:rgba(35,57,63,.045)}
.shade.hol{background:repeating-linear-gradient(135deg,rgba(35,57,63,.09) 0 4px,rgba(35,57,63,.03) 4px 8px)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--alert);z-index:2}
.bar{position:absolute;top:7px;height:20px;border-radius:4px;border:0;cursor:pointer;z-index:2;color:#fff;font-size:11.5px;text-align:left;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar.dev{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.bar:hover,.ms:hover{filter:brightness(1.12);box-shadow:0 0 0 2px rgba(0,105,131,.35)}
.bar[aria-current="true"],.ms[aria-current="true"]{box-shadow:0 0 0 3px var(--mint)}
.ms{position:absolute;top:8px;width:18px;height:18px;transform:rotate(45deg);border:2px solid #fff;border-radius:2px;cursor:pointer;z-index:3;padding:0}
.msl{position:absolute;top:8px;font-size:11.5px;font-weight:500;white-space:nowrap;z-index:2;pointer-events:none;color:var(--ink)}
.row.mtg,.row.mtg .lab{background:#FFF8E5}
.row.mtg:hover,.row.mtg:hover .lab{background:#FFF1CC}
.gblk{position:relative}
.dl{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #5BBDEB;z-index:2;pointer-events:none}
.row.fr{background:#F4FAFD}.row.fr .lab{background:#F4FAFD;color:#1F6F96;font-weight:500}
.docb{position:absolute;top:5px;width:24px;height:24px;border-radius:6px;border:2px solid #5BBDEB;background:#fff;color:#1F7FB0;cursor:pointer;z-index:3;padding:0;display:grid;place-items:center}
.docb:hover{background:#CFEBFA}.docb svg{width:14px;height:14px}
.docic{width:14px;height:14px;flex:0 0 auto;color:#1F7FB0}
.dli{padding:9px 0;border-bottom:1px solid var(--line)}.dli:last-child{border-bottom:0}
.dli ul{margin:4px 0 0}
.gsel{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 28px 5px 10px;background:#fff;color:var(--ink);cursor:pointer}
.tools label{color:var(--grey);font-size:13px}
.pen{margin-left:auto;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--grey);border:1px solid transparent}.pen:hover,.pen:focus-visible{color:var(--teal);border-color:var(--line);background:#fff}.pen svg{width:16px;height:16px}.pen[hidden]{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--grey);font-size:12.5px;align-items:center}.legend[hidden]{display:none}
.foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:10px;min-height:30px}
#actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:14px 0}
.acard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:8px}
.acard h3{margin:0;font-size:16px;color:var(--ink)} .acard p{margin:0} .acard a{color:var(--teal)} .acard code{font-size:12px;word-break:break-all}
.acard .aopen{align-self:flex-start;margin-top:auto;text-decoration:none;color:var(--ink)} .aedit{border-style:dashed}
.legend .d{display:inline-block;width:12px;height:12px;transform:rotate(45deg);background:var(--ink);margin-right:6px;vertical-align:-1px}
.legend .c{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .dd{display:inline-block;width:18px;height:0;border-top:2px dashed #5BBDEB;margin-right:6px;vertical-align:3px}
.legend .h{display:inline-block;width:18px;height:10px;margin-right:6px;background:repeating-linear-gradient(135deg,rgba(35,57,63,.25) 0 3px,rgba(35,57,63,.06) 3px 6px);vertical-align:-1px}
/* Tasks */
.stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.progress{flex:1 1 220px;max-width:360px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress div{height:100%;background:#3DDC84}
.list{border:1px solid var(--line);border-radius:8px;overflow-x:hidden;overflow-y:auto;flex:1;min-height:0}
.trow{display:grid;grid-template-columns:28px 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.trow:last-child{border-bottom:0}
.trow:hover{background:#FAFCFC}
.trow[aria-current="true"]{background:var(--soft)}
.tt{font-weight:500}
.tm{color:var(--grey);font-size:12.5px;font-variant-numeric:tabular-nums}
.tick{width:20px;height:20px;border:2px solid #AEB6B9;border-radius:5px;display:grid;place-items:center;flex:0 0 auto}
.tick svg{width:14px;height:14px}
.tick.ck{cursor:pointer}.tick.ck:hover{box-shadow:0 0 0 3px rgba(91,189,235,.45)}
.bar.mv{cursor:grab}.bar.mv:active{cursor:grabbing}
.st-done .tick{background:#3DDC84;border-color:#3DDC84} .st-done .tick svg{stroke:#0B3D1E}
.st-ongoing .tick{border-color:#5BBDEB;background:#CFEBFA}
.st-review .tick{border-color:#7A3E8E;background:#7A3E8E}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;border:0;white-space:nowrap;font-weight:500}
.pill.inbox{background:#E4E8EA;color:#4A5256}
.pill.ongoing{background:#9AD7F5;color:#0B3A55}
.pill.review{background:#7A3E8E;color:#fff}
.pill.done{background:#3DDC84;color:#0B3D1E}
/* Drawer */
#scrim{position:fixed;inset:0;background:rgba(35,57,63,.25);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;border-left:2px solid var(--ink);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .18s;z-index:21;overflow:auto;padding:22px 22px 40px}
body.open #drawer{transform:none} body.open #scrim{opacity:1;pointer-events:auto}
#drawer h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:8px 0 4px;letter-spacing:.02em}
#drawer{padding-top:14px}
#drawer h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--teal);margin:20px 0 6px}
#drawer ul{margin:0;padding-left:18px} #drawer li{margin:3px 0}
.x{position:absolute;top:6px;right:10px;border:0;background:none;font-size:52px;line-height:1;cursor:pointer;color:var(--grey);padding:0 8px;z-index:2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:13.5px}
.kv dt{color:var(--grey)} .kv dd{margin:0}
.empty{color:var(--grey);font-style:italic}
.phead{padding:0 56px 14px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.phead h2{margin:8px 0 0}
.mt{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:13.5px;margin:4px 0 4px}
.mt th{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--grey);font-weight:600;text-align:left;padding:7px 10px;background:var(--soft);border-bottom:1px solid var(--line)}
.mt td{padding:9px 10px;vertical-align:top}
.mt th+th,.mt td+td{border-left:1px solid var(--line)}
.linked{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.trow.nt{grid-template-columns:1fr auto auto}
.wf{margin:6px 0 0;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.wf svg{width:100%;height:auto;display:block}
.wf figcaption{color:var(--grey);font-size:12px;margin-top:4px}
.wfl{display:block;text-decoration:none;color:inherit} .wfl:hover .wf,.wfl:focus-visible .wf{border-color:var(--teal)} .wfl .wf figcaption{color:var(--teal);font-weight:500} .wfl-t{color:var(--teal);font-weight:500}
.wf .f{fill:#F3F7F7;stroke:#CBD5D8;stroke-width:1.2} .wf .f2{fill:#fff;stroke:#CBD5D8;stroke-width:1.2} .wf .n{fill:#fff;stroke:#B9C3C6;stroke-width:1.2}
.wf .a{fill:#5F676B;stroke:none} .wf .g{fill:#D5DDDF;stroke:none} .wf .l,.wf .l2{fill:none;stroke:#9AA0A6;stroke-width:1.5}
.wf text{font:11px "Fira Sans",Arial,sans-serif;fill:#535353} .wf text.w{fill:#fff;font-weight:500}
#editbar{margin-left:auto;flex:none;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#editbar .btn:disabled{opacity:.45;cursor:default}
.hd{position:absolute;top:5px;width:8px;height:24px;border-radius:3px;background:#fff;border:2px solid var(--ink);cursor:ew-resize;z-index:4;touch-action:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.tag i{width:10px;height:10px;border-radius:2px;display:inline-block}
.warn{background:#FFF6E5;border-left:3px solid #C9922E;padding:7px 10px;margin-top:12px;font-size:13px}
a{color:var(--teal)}
@media (max-width:640px){:root{--labw:150px} .wrap{padding:14px 12px 40px} .brand{font-size:18px} .trow{grid-template-columns:28px 1fr;} .trow .tm,.trow .pill{grid-column:2} }
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,460px);grid-template-rows:minmax(0,1fr);gap:16px}
.tpanel{overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:18px 22px 28px;background:#fff;min-height:0}
.tpanel h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:8px 0 4px;letter-spacing:.02em}
.tpanel h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--teal);margin:20px 0 6px}
.tpanel ul{margin:0;padding-left:18px} .tpanel li{margin:3px 0}
@media (max-width:1023px){.split{grid-template-columns:minmax(0,1fr)}.tpanel{display:none}.wrap{padding:14px 16px 10px}}
@media (max-width:640px){.meta{width:100%;justify-content:space-between;gap:12px}.meta b{font-size:18px}.sub{font-size:12.5px}header{gap:8px 12px;padding-bottom:10px}nav button{padding:6px 10px;font-size:13px}.chip{font-size:12.5px;padding:3px 9px}.legend,.note{font-size:11.5px}}
.foot .legend{flex:1 1 0;min-width:0}
@media (max-width:640px){.navbar .tools{width:100%;flex-wrap:nowrap}.navbar .tools .gsel{flex:1 1 0;min-width:0}}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}
#gate{max-width:420px;margin:56px auto}
#gate h1{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:20px;margin:0 0 8px;color:var(--teal)}
#gate label{display:block;font-weight:500;margin:16px 0 4px}
#gate input{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--grey);border-radius:6px;margin-bottom:12px}
#gate .rm{display:flex;gap:8px;align-items:center;font-weight:400;font-size:13px;margin:0 0 12px;color:var(--grey)}
#gate .rm input{width:auto;margin:0}
#gate #gate-err{color:var(--alert);margin-top:10px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><span>Re Open</span> <i>·</i> <span class="sr">Sun RAEE</span></div>
      <div class="sub">Websites roadmap</div>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <div id="gate"><form id="gate-form" autocomplete="off"><label for="gate-pw">Password</label><input id="gate-pw" type="password" autocomplete="current-password" required><label class="rm"><input type="checkbox" id="gate-rm" checked> Ricorda su questo dispositivo</label><button class="btn" id="gate-btn" type="submit">Entra</button><div id="gate-err" role="alert"></div></form></div>
  <div id="app" hidden>
  <div class="navbar">
  <nav role="tablist" aria-label="Sezioni">
    <button role="tab" id="tab-roadmap" aria-selected="true" aria-controls="p-roadmap">Roadmap</button>
    <button role="tab" id="tab-tasks" aria-selected="false" aria-controls="p-tasks">Tasks</button>
    <button role="tab" id="tab-assets" aria-selected="false" aria-controls="p-assets">Assets</button>
  </nav>
    <div class="tools"><label for="gf">Fase</label><select class="gsel" id="gf" aria-label="Filtra per fase"><option value="all">Tutte le fasi</option></select><label for="sf">Stato</label><select class="gsel" id="sf" aria-label="Filtra per stato"></select></div>
  </div>
  <section id="p-roadmap" role="tabpanel" aria-labelledby="tab-roadmap">
    <div class="gantt" id="gantt" tabindex="0" aria-label="Diagramma di Gantt"></div>
  </section>
  <section id="p-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden>
    <div class="stats"><div class="progress" aria-hidden="true"><div id="pbar"></div></div><div id="ptxt" class="tm"></div></div>
    <div class="split"><div class="list" id="tlist"></div><aside class="tpanel" id="tpanel" aria-label="Dettaglio task"></aside></div>
  </section>
  <section id="p-assets" role="tabpanel" aria-labelledby="tab-assets" hidden>
    <div id="alist"></div>
  </section>
  <div class="foot">
    <div class="legend" id="legend"><span><i class="d" style="background:#E8A317"></i>Incontri e check</span><span><i class="d"></i>Chiusura</span><span><i class="dd"></i>Deliverable di fase (icona documento)</span><span id="lgst"><span style="margin-right:12px"><i class="c" style="background:#3DDC84"></i>Fatto</span><span style="margin-right:12px"><i class="c" style="background:#5BBDEB"></i>In corso</span><span style="margin-right:12px"><i class="c" style="background:#7A3E8E"></i>In review</span></span><span id="lgco"></span><span><i class="h"></i>Giorni non lavorativi</span><span id="updated"></span></div>
    <div id="actions"><a class="pen" id="pen" href="?edit=1" target="_blank" rel="noopener" title="Modalità modifica (si apre in una nuova scheda)" aria-label="Modalità modifica"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M11 2.2l2.8 2.8-8.3 8.3-3.5.7.7-3.5z"/><path d="M9.6 3.6l2.8 2.8"/></svg></a></div>
  </div>
  </div>
</div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Dettaglio" aria-hidden="true"><button class="x" id="dx" aria-label="Chiudi">×</button><div id="dbody"></div></aside>

const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const RMK='ro_rm_v2', RMTTL=30*864e5;
async function gunz(buf){ const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function openWith(key,E){
  E=E||ENC;
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
  const u8=E.z?await gunz(pt):new Uint8Array(pt);
  return JSON.parse(new TextDecoder().decode(u8));
}
async function keyFromPw(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);

/* Drawer */
function list(a){return a&&a.length?'<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<div class="empty">Da definire.</div>'}
function links(a){return a&&a.length?'<ul>'+a.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join('')+'</ul>':'<div class="empty">Nessun link per ora.</div>'}
function show(html,id){curId=id;$('#dbody').innerHTML=html;document.body.classList.add('open');$('#drawer').setAttribute('aria-hidden','false');mark();$('#dx').focus()}
const GG=(a,b)=>workdays(a,b)+'gg';
const sh=t=>fmt(t,{day:'numeric',month:'short'});
const head=(tag,title)=>`<div class="phead">${tag}<h2>${esc(title)}</h2></div>`;
const tbl=c=>`<table class="mt"><thead><tr>${c.map(x=>`<th>${x[0]}</th>`).join('')}</tr></thead><tbody><tr>${c.map(x=>`<td>${x[1]}</td>`).join('')}</tr></tbody></table>`;
const sec=(t,h)=>h?`<h3>${t}</h3>${h}`:'';
const wfBlock=(k,u)=>{const has=!!(k&&WF[k]);if(!has&&!u)return '';const cap=u?'Apri l\'artefatto di lavoro →':'Schema indicativo: il disegno finale può variare.';const fig=has?`<figure class="wf">${WF[k]}<figcaption>${cap}</figcaption></figure>`:`<p class="wfl-t">${cap}</p>`;return `<h3>${u?'Artefatto di lavoro':'Esempio di output'}</h3>`+(u?`<a class="wfl" href="${esc(u)}" target="_blank" rel="noopener">${fig}</a>`:fig)};
const askBlock=i=>i&&i.ask?`<h3>Tempo richiesto</h3><p>${esc(i.ask)}</p>`:'';
const methBlock=i=>i&&i.method&&i.method.length?`<h3>Metodo</h3>${list(i.method)}`:'';
const pillOf=t=>`<span class="pill ${t.status}">${STATUSES[t.status]}</span>`;
const taskRow=t=>`<div class="linked"><button class="trow nt st-${t.status}" data-goto-task="${t.id}" type="button"><span><span class="tt">${esc(t.title)}</span><br><span class="tm">${esc(t.owner)}</span></span><span class="tm">entro ${fmt(d(t.due))}</span>${pillOf(t)}</button></div>`;
function bindTask(root){root.querySelectorAll('[data-goto-task]').forEach(el=>el.onclick=()=>gotoTask(el.dataset.gotoTask))}
function openItem(id){
  const i=itemById[id];const p=PHASES[i.phase];const t=i.task?taskById[i.task]:null;const a=d(i.start),b=d(i.end);
  const when=i.kind==='milestone'?fmtL(a):i.segs?i.segs.map(g=>`${sh(d(g[0]))} → ${sh(d(g[1]))}`).join('<br>'):`${sh(a)} → ${sh(b)}<br><span class="tm">${GG(i.start,i.end)}</span>`;
  let h=head(i.sal?`<span class="tag"><i style="background:${MEET}"></i>SAL · ${esc(p.label)}</span>`:i.meeting?`<span class="tag"><i style="background:${MEET}"></i>Incontro · ${esc(p.label)}</span>`:`<span class="tag"><i style="background:${coOf(i).color}"></i>${esc(p.label)} · ${esc(coOf(i).label)}</span>`,i.name)
   +tbl([['Quando',when],['Chi',esc(i.owner)],['Stato',t?pillOf(t):'<span class="tm">—</span>']])
   +`<p>${esc(i.summary)}</p>`+(i.points&&i.points.length?list(i.points):'');
  if(i.phase==='dev')h+=`<div class="warn">Date da confermare con ${/^Agenzia/.test(i.owner||'')?"l'agenzia":'lo sviluppatore'}.</div>`;
  h+=askBlock(i)+methBlock(i);
  if(i.kind==='milestone'&&i.agenda.length)h+=`<h3>Agenda</h3>${list(i.agenda)}`;
  if(i.outputs.length)h+=`<h3>Esito atteso</h3>${list(i.outputs)}`;
  h+=wfBlock(i.wf,i.artifact);
  if(t)h+=`<h3>Task collegata</h3>${taskRow(t)}`;
  show(h,i.id); bindTask($('#dbody'));
}
function openDeliv(key){
  const [g,ks]=key.split(':'),k=+ks;
  const its=ITEMS.filter(i=>i.phase===g&&!i.sal).sort((x,y)=>d(x.start)-d(y.start)||(x.order||0)-(y.order||0));
  const gmax=Math.max(...its.map(i=>d(i.end))), gl=PHASES[g].label;
  const mk=DELIVS.filter(m=>m.group===g).map(m=>Object.assign({},m,{t:m.date?d(m.date):gmax}));
  const m=mk[k], lo=k?mk[k-1].t:-Infinity, last=k===mk.length-1;
  const inR=i=>d(i.end)>lo&&d(i.end)<=m.t;
  const blk=a=>a.filter(i=>i.outputs&&i.outputs.length).map(i=>`<div class="dli"><div class="tt">${esc(i.name)}</div><ul>${i.outputs.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`).join('');
  const bars=its.filter(i=>i.kind==='bar'&&inR(i)), ms=its.filter(i=>i.kind==='milestone'&&inR(i));
  const after=last?its.filter(i=>d(i.end)>m.t&&i.kind==='bar'):[];
  const title=m.label?`Deliverable ${m.label} · ${gl}`:`Deliverable · ${gl}`;
  let h=head(`<span class="tag"><i style="background:#5BBDEB"></i>Fine blocco · ${esc(gl)}</span>`,title)
   +tbl([['Pronti entro',sh(m.t)],['Attività nel blocco',String(bars.length)]])
   +`<p>Cosa è pronto${m.label?' alla consegna '+esc(m.label):' al termine della fase '+esc(gl)}.</p>`+`<h3>Deliverable</h3>`+(blk(bars)||'<p class="empty">Nessun deliverable definito.</p>');
  if(blk(ms))h+=`<h3>Esiti degli incontri</h3>`+blk(ms);
  if(after.length)h+=`<h3>Dopo questa consegna</h3><ul>${after.map(i=>`<li>${esc(i.name)} (${sh(d(i.start))} → ${sh(d(i.end))})</li>`).join('')}</ul>`;
  if(g==='dev')h+=`<div class="warn">Date da confermare con lo sviluppatore e con l'agenzia.</div>`;
  show(h,'dl-'+key);
}
function taskHtml(id){
  const t=taskById[id];const p=PHASES[t.phase];const it=t.item?itemById[t.item]:null;
  const meet=it&&it.kind==='milestone';
  let h=head(`<span class="tag"><i style="background:${taskCo(t).color}"></i>${esc(p.label)} · ${esc(taskCo(t).label)}</span>`,t.title)
   +tbl([['Entro',sh(d(t.due))],['Chi',esc(t.owner)],['Stato',pillOf(t)]])
   +`<h3>Obiettivo</h3><p>${esc(t.goal)}</p>`+askBlock(it)+methBlock(it);
  if(t.agenda&&t.agenda.length)h+=`<h3>${meet?'Agenda':'Punti di lavoro'}</h3>${list(t.agenda)}`;
  h+=`<h3>Link e documenti</h3>${links(t.links)}`+wfBlock(it&&it.wf,it&&it.artifact);
  if(it)h+=`<h3>In roadmap</h3><p><a href="#roadmap" data-goto="${it.id}">${esc(it.name)}</a>, ${fmt(d(it.start))}${it.kind==='bar'?' → '+fmt(d(it.end)):''}</p>`;
  return h;
}
function bindGoto(root){root.querySelectorAll('[data-goto]').forEach(el=>el.onclick=e=>{e.preventDefault();setTab('roadmap');openItem(el.dataset.goto)})}
function openTask(id){show(taskHtml(id),id);bindGoto($('#dbody'))}
function selectTask(id){selT=id;$('#tpanel').innerHTML=taskHtml(id);$('#tpanel').scrollTop=0;bindGoto($('#tpanel'));mark()}
function gotoTask(id){setTab('tasks');if(MQ.matches)selectTask(id);else openTask(id)}
function closeDrawer(){document.body.classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');curId=null;mark()}
function mark(){
  document.querySelectorAll('.bar,.ms').forEach(e=>e.setAttribute('aria-current',e.dataset.id===curId));
  document.querySelectorAll('.trow[data-t]').forEach(e=>e.setAttribute('aria-current',e.dataset.t===(MQ.matches?selT:curId)));
}
(function(){const sel=$('#gf');GROUPS.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=PHASES[g].label;sel.appendChild(o)});sel.onchange=()=>{gf=sel.value;renderGantt();renderTasks()};$('#sf').onchange=()=>{statusF=$('#sf').value;renderGantt();renderTasks()}})();
$('#dx').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

/* Assets: artefatti di lavoro (data.py ASSETS) */
function renderAssets(){
  const A=(PROJECT.ASSETS||[]).filter(a=>a.url||EDIT);
  let h='<div class="agrid">';
  A.forEach(a=>{const t=a.task&&taskById[a.task];
    h+=`<article class="acard"><div class="tag">${esc(a.kind||'')}${a.date?' · '+fmt(d(a.date),{day:'2-digit',month:'2-digit',year:'numeric'}):''}</div><h3>${esc(a.title)}</h3>`
      +(t?`<p class="tm">Task: <a href="#tasks" data-gotot="${esc(a.task)}">${esc(t.title)}</a></p>`:'')
      +(a.url?`<a class="btn aopen" href="${esc(a.url)}" target="_blank" rel="noopener">Apri ↗</a>`:`<p class="tm">File locale: <code>${esc(a.path||'')}</code></p>`)+'</article>'});
  if(!EDIT)h+='<article class="acard aedit"><div class="tag">Roadmap</div><h3>Modalità modifica</h3><p class="tm">Stati e date, poi Pubblica modifiche.</p><a class="btn aopen" href="?edit=1" target="_blank" rel="noopener">Apri ↗</a></article>';
  h+='</div>';
  $('#alist').innerHTML=h;
  $('#alist').querySelectorAll('[data-gotot]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoTask(el.dataset.gotot)});
}

/* Tab */
function setTab(n){
  ['roadmap','tasks','assets'].forEach(k=>{$('#p-'+k).hidden=k!==n;$('#tab-'+k).setAttribute('aria-selected',k===n)});
  {const tl=document.querySelector('.navbar .tools');if(tl)tl.style.display=n==='assets'?'none':''}
  try{if(location.hash!=='#'+n)history.replaceState(null,'','#'+n)}catch(e){}
  $('#legend').hidden=n!=='roadmap'; closeDrawer(); if(n==='roadmap'){if(fitDW())renderGantt()}
}
$('#tab-roadmap').onclick=()=>setTab('roadmap');$('#tab-tasks').onclick=()=>setTab('tasks');$('#tab-assets').onclick=()=>setTab('assets');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='tasks'||h==='roadmap'||h==='assets')setTab(h)});
renderGantt();renderTasks();renderAssets();
MQ.addEventListener('change',()=>{closeDrawer();renderTasks()});
let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{if(!$('#p-roadmap').hidden&&fitDW())renderGantt()},120)});
if(EDIT){
  const PATK='ro_pat_v1',PATTTL=30*864e5;
  const getPat=()=>{try{const r=JSON.parse(localStorage.getItem(PATK)||'null');if(!r)return null;if(Date.now()-r.t>PATTTL){localStorage.removeItem(PATK);return null}return r.p}catch(_){return null}};
  const setPat=p=>{try{localStorage.setItem(PATK,JSON.stringify({p,t:Date.now()}))}catch(_){}};
  const forgetPat=()=>{try{localStorage.removeItem(PATK);sessionStorage.removeItem('ro_pat')}catch(_){}};
  if($('#pen'))$('#pen').hidden=true;
  const eb=document.createElement('div');eb.id='editbar';
  const canPub=!!(window.RO_KEY&&window.RO_ENC);
  eb.innerHTML='<span id="eb-n" class="tm"></span><button class="btn" id="eb-undo" type="button" disabled>Annulla</button>'+(canPub?'<button class="btn" id="eb-pub" type="button" disabled>Pubblica modifiche</button>':'<button class="btn" id="eb-copy" type="button">Copia modifiche</button>');
  $('#actions').appendChild(eb);
  const LOAD={st:{},dt:{}};TASKS.forEach(t=>LOAD.st[t.id]=t.status);ITEMS.forEach(i=>LOAD.dt[i.id]=[i.start,i.end]);
  let drag=null,moved=false;
  const curState=()=>{const st={},dt={};TASKS.forEach(t=>{if(t.status!==BASE.st[t.id])st[t.id]=t.status});ITEMS.forEach(i=>{const b=BASE.dt[i.id];if(b&&(i.start!==b[0]||i.end!==b[1]))dt[i.id]=[i.start,i.end]});return {status:st,dates:dt}};
  const diffLoad=()=>{let n=0;TASKS.forEach(t=>{if(t.status!==LOAD.st[t.id])n++});ITEMS.forEach(i=>{const b=LOAD.dt[i.id];if(b&&(i.start!==b[0]||i.end!==b[1]))n++});return n};
  const upd=()=>{const n=diffLoad();$('#eb-n').textContent=n?n+' modific'+(n==1?'a':'he'):'';$('#eb-undo').disabled=false;$('#eb-undo').title=n?'Scarta le modifiche non pubblicate':'Esci dalla modalità modifica';const pb=$('#eb-pub');if(pb)pb.disabled=!n};
  window.__chg=upd;
  upd();
  const markMv=()=>$('#gantt').querySelectorAll('.bar').forEach(b=>{const i=itemById[b.dataset.id];if(i&&i.kind==='bar'&&!i.segs&&!i.sal)b.classList.add('mv')});
  const _rg=renderGantt;renderGantt=function(){_rg();markMv()};markMv();
  $('#gantt').addEventListener('pointerdown',e=>{const hd=e.target.closest('.hd'),bar=e.target.closest('.bar.mv');const el=hd||bar;if(!el)return;const i=itemById[el.dataset.id];
    if(hd)e.preventDefault();moved=false;drag={i,side:hd?hd.dataset.side:'m',x0:e.clientX,s0:d(i.start),e0:d(i.end),el};try{el.setPointerCapture(e.pointerId)}catch(_){}});
  window.addEventListener('pointermove',e=>{if(!drag)return;const px=e.clientX-drag.x0;if(Math.abs(px)>3)moved=true;if(!moved)return;const dl=Math.round(px/DW)*MS;const i=drag.i;
    if(drag.side==='r')i.end=iso(Math.max(drag.s0,drag.e0+dl));else if(drag.side==='l')i.start=iso(Math.min(drag.e0,drag.s0+dl));else{i.start=iso(drag.s0+dl);i.end=iso(drag.e0+dl)}
    const g=$('#gantt'),bar=g.querySelector('.bar[data-id="'+i.id+'"]'),a=d(i.start),b=d(i.end),x=t=>Math.round((t-T0)/MS)*DW;
    bar.style.left=x(a)+'px';bar.style.width=Math.max(DW,x(b)-x(a)+DW)+'px';
    const hl=g.querySelector('.hd[data-id="'+i.id+'"][data-side="l"]'),hr=g.querySelector('.hd[data-id="'+i.id+'"][data-side="r"]');if(hl)hl.style.left=(x(a)-4)+'px';if(hr)hr.style.left=(x(b)+DW-4)+'px';
    bar.title=i.name+': '+fmt(a)+'-'+fmt(b)+' ('+GG(i.start,i.end)+')';upd()});
  window.addEventListener('pointerup',()=>{if(drag){const was=moved;drag=null;if(was){renderGantt();setTimeout(()=>{moved=false},0)}}});
  $('#gantt').addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();e.preventDefault()}},true);
  $('#eb-undo').onclick=()=>{if(!diffLoad()){try{const u=new URL(location.href);u.searchParams.delete('edit');location.href=u.toString()}catch(_){location.search=''}return}const R=LOAD;TASKS.forEach(t=>{t.status=R.st[t.id]});ITEMS.forEach(i=>{const b=R.dt[i.id];if(b){i.start=b[0];i.end=b[1]}});renderGantt();renderTasks();renderMeta();upd()};
  if($('#eb-copy'))$('#eb-copy').onclick=()=>{const s=curState();const t=Object.keys(s.dates).map(id=>`${id} | ${itemById[id].name} | ${itemById[id].start} → ${itemById[id].end} | ${GG(itemById[id].start,itemById[id].end)}`).concat(Object.keys(s.status).map(id=>`${id} | stato: ${STATUSES[s.status[id]]}`)).join('\n')||'Nessuna modifica';
    const done=()=>{$('#eb-n').textContent='Copiato'};
    try{navigator.clipboard.writeText(t).then(done,()=>{prompt('Copia manualmente',t)})}catch(e){prompt('Copia manualmente',t)}};
  if(canPub)$('#eb-pub').onclick=async()=>{
    const out=$('#eb-n'),btn=$('#eb-pub');
    let pat=getPat();
    if(!pat){pat=prompt('Token GitHub (fine-grained, solo repo roadmap-sunraee-reopen, permesso Contents: Read and write). Resta salvato su questo dispositivo per 30 giorni.');if(!pat)return;pat=pat.trim();setPat(pat)}
    const api='https://api.github.com/repos/massicuccistudio/roadmap-sunraee-reopen/contents/state.enc.json',H={Authorization:'Bearer '+pat,Accept:'application/vnd.github+json'};
    btn.disabled=true;let msg='';out.textContent='Pubblico…';
    try{
      let sha;const g=await fetch(api+'?ref=main',{headers:H,cache:'no-store'});
      if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(g.status);
      const body=await window.RO_ENC(curState());
      const p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({message:'Roadmap: aggiornamento stato e date',content:btoa(JSON.stringify(body)),sha,branch:'main'})});
      if(!p.ok)throw new Error(p.status);
      TASKS.forEach(t=>LOAD.st[t.id]=t.status);ITEMS.forEach(i=>LOAD.dt[i.id]=[i.start,i.end]);msg='Pubblicato: online tra pochi minuti';
    }catch(err){const c=String(err.message||err);if(c==='401'||c==='403'||c==='404')forgetPat();msg='Errore '+c+(c==='401'?' (token non valido)':c==='403'||c==='404'?' (token senza permessi sul repo)':'')}
    upd();out.textContent=msg};
}
{const h0=location.hash.slice(1);setTab(h0==='tasks'||h0==='assets'?h0:'roadmap')}
}
</script>
